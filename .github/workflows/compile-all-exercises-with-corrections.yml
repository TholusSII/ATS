name: Compiler le PDF complet avec corrigés

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compile-all-exercises-with-corrections.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-complet-corriges-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.title, 'Compiler le PDF complet corrigé')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 1

      - name: Vérifier la banque de 468 exercices
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_all_exos.py
          python3 tools/generate_all_corriges.py
          grep -q '468 exercices' ALL_EXOS/inputs.tex
          grep -q '468 corrigés' ALL_EXOS/corriges_inputs.tex

      - name: Préparer uniquement l’environnement de compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ALL_EXOS/gnuplot/ALL_EXOS_CORRIGES
          python3 - <<'PY'
          from pathlib import Path
          import re

          title_pattern = re.compile(r'^(\s*\\exer\{[^\r\n]*?\})\\n', re.MULTILINE)
          qr_pattern = re.compile(r'\\qrcode(?:\[[^\]]*\])?\{([^{}]+)\}')
          for path in Path('.').rglob('*.tex'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              updated = title_pattern.sub(r'\1\n', text)
              updated = qr_pattern.sub(
                  lambda match: r'\fbox{\href{' + match.group(1) + r'}{\textsf{Lien vers le formulaire}}}',
                  updated,
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          compat = Path('Style/exercices_compat.tex')
          text = compat.read_text(encoding='utf-8')
          marker = r'\@ifundefined{c@question}{\newcounter{question}}{}'
          addition = marker + '\n' + r'\@ifundefined{c@exo}{\newcounter{exo}}{}'
          if r'\@ifundefined{c@exo}' not in text:
              text = text.replace(marker, addition)
              compat.write_text(text, encoding='utf-8')
          PY

      - name: Créer le point d’entrée avec corrigés
        shell: bash
        run: |
          cat > ALL_EXOS/ALL_EXOS_CORRIGES.tex <<'EOF'
          \def\ModeCorriges{1}
          \input{ALL_EXOS.tex}
          EOF

      - name: Compiler le recueil complet
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ALL_EXOS_CORRIGES.tex
          working_directory: ALL_EXOS
          latexmk_shell_escape: true
          extra_system_packages: "gnuplot"
          pre_compile: |
            cnf="$(kpsewhich texmf.cnf)"
            printf '\nextra_mem_top = 12000000\nextra_mem_bot = 12000000\n' >> "$cnf"
            kpsewhich -var-value=extra_mem_top
            kpsewhich -var-value=extra_mem_bot
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Publier le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation-pdf-complet
          path: |
            ALL_EXOS/ALL_EXOS_CORRIGES.log
            ALL_EXOS/ALL_EXOS_CORRIGES.fls
            ALL_EXOS/ALL_EXOS_CORRIGES.fdb_latexmk
          if-no-files-found: warn
          retention-days: 30

      - name: Vérifier et nommer le PDF
        id: verify
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s ALL_EXOS/ALL_EXOS_CORRIGES.pdf ]]; then
            cp ALL_EXOS/ALL_EXOS_CORRIGES.pdf PDF_COMPLET_EXERCICES_CORRIGES.pdf
            size=$(stat -c%s PDF_COMPLET_EXERCICES_CORRIGES.pdf)
            echo "PDF généré : $size octets"
            if [[ "$size" -gt 1000000 ]]; then
              echo 'pdf_ready=true' >> "$GITHUB_OUTPUT"
            else
              echo 'pdf_ready=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'pdf_ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publier le PDF
        if: steps.verify.outputs.pdf_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PDF-complet-exercices-corriges
          path: PDF_COMPLET_EXERCICES_CORRIGES.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Signaler l’absence de PDF exploitable
        if: steps.verify.outputs.pdf_ready != 'true'
        shell: bash
        run: |
          echo 'Aucun PDF complet exploitable n’a été produit ; le journal a été publié.'
          exit 1
