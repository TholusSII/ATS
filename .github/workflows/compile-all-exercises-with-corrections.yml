name: Compiler le PDF complet avec corrigés

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-complet-corriges-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.title, 'Compiler le PDF complet corrigé')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Récupérer exactement le commit demandé
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Vérifier la banque de 468 exercices
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_all_exos.py
          python3 tools/generate_all_corriges.py
          grep -q '468 exercices' ALL_EXOS/inputs.tex
          grep -q '468 corrigés' ALL_EXOS/corriges_inputs.tex

      - name: Préparer les compilations par famille
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          all_dir = root / 'ALL_EXOS'
          title_pattern = re.compile(r'^(\s*\\exer\{[^\r\n]*?\})\\n', re.MULTILINE)
          qr_pattern = re.compile(r'\\qrcode(?:\[[^\]]*\])?\{([^{}]+)\}')
          graphics_pattern = re.compile(r'(\\includegraphics(?:\[[^\]]*\])?\{)([^{}]+)(\})')
          extensions = ('', '.pdf', '.png', '.jpg', '.jpeg', '.PDF', '.PNG', '.JPG', '.JPEG')

          def existing_path(base: Path, reference: str):
              for parent in (base, root, all_dir):
                  for ext in extensions:
                      path = (parent / (reference + ext)).resolve()
                      if path.is_file():
                          return path
              return None

          for path in root.rglob('*.tex'):
              if '.git' in path.parts or path.name.startswith(('PART_', 'FRONTMATTER')):
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              updated = title_pattern.sub(r'\1\n', text)
              updated = qr_pattern.sub(
                  lambda match: r'\fbox{\href{' + match.group(1) + r'}{\textsf{Lien vers le formulaire}}}',
                  updated,
              )

              def repair_graphic(match):
                  reference = match.group(2)
                  if existing_path(path.parent, reference):
                      return match.group(0)
                  stem = Path(reference).name
                  simple = stem[:-2] if stem.endswith('_c') else stem
                  candidates = []
                  image_dir = path.parent / 'images'
                  if image_dir.is_dir():
                      candidates.extend(sorted(image_dir.glob(simple + '*')))
                  if not candidates:
                      candidates.extend(sorted(root.rglob(simple + '*')))
                  candidates = [item for item in candidates if item.is_file() and item.suffix.lower() in {'.pdf', '.png', '.jpg', '.jpeg'}]
                  if not candidates:
                      return r'\fbox{\textit{Illustration non disponible}}'
                  candidate = candidates[0]
                  relative = Path(shutil.os.path.relpath(candidate, path.parent)).as_posix()
                  return match.group(1) + relative + match.group(3)

              updated = graphics_pattern.sub(repair_graphic, updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          compat = Path('Style/exercices_compat.tex')
          text = compat.read_text(encoding='utf-8')
          marker = r'\@ifundefined{c@question}{\newcounter{question}}{}'
          addition = marker + '\n' + r'\@ifundefined{c@exo}{\newcounter{exo}}{}'
          if r'\@ifundefined{c@exo}' not in text:
              compat.write_text(text.replace(marker, addition), encoding='utf-8')

          inputs = (all_dir / 'inputs.tex').read_text(encoding='utf-8')
          chapter_re = re.compile(r'(?m)^\\clearpage\s*\n\\chapter\{([^\n{}]*)\}\s*\n')
          matches = list(chapter_re.finditer(inputs))
          if not matches:
              raise SystemExit('Aucun chapitre trouvé dans ALL_EXOS/inputs.tex')

          master = (all_dir / 'ALL_EXOS.tex').read_text(encoding='utf-8')
          preamble, document = master.split(r'\begin{document}', 1)
          before_input = document.split(r'\input{inputs.tex}', 1)[0]
          setup = before_input[before_input.index(r'\mainmatter'):]

          def tex_escape(value: str) -> str:
              replacements = {'&': r'\&', '%': r'\%', '#': r'\#', '_': r'\_'}
              return ''.join(replacements.get(char, char) for char in value)

          manifest = []
          summary_rows = []
          total_exercises = 0
          reset_modes = r'\proffalse' + '\n' + r'\ifdefined\correctionfalse\correctionfalse\fi' + '\n'
          for index, match in enumerate(matches, 1):
              end = matches[index].start() if index < len(matches) else len(inputs)
              block = inputs[match.start():end].rstrip() + '\n'
              block = block.replace(r'\subimport', reset_modes + r'\subimport')
              title = match.group(1)
              exercise_count = block.count(r'\subimport')
              total_exercises += exercise_count
              prefix_match = re.match(r'(\d+)', title)
              chapter_number = int(prefix_match.group(1)) if prefix_match else index
              stem = f'PART_{index:02d}'
              (all_dir / f'inputs_{stem}.tex').write_text(block, encoding='utf-8')
              part = (
                  r'\def\ModeCorriges{1}' + '\n' + preamble + r'\begin{document}' + '\n' +
                  setup + f'\\setcounter{{chapter}}{{{chapter_number - 1}}}\n' +
                  f'\\input{{inputs_{stem}.tex}}\n' + r'\end{document}' + '\n'
              )
              (all_dir / f'{stem}.tex').write_text(part, encoding='utf-8')
              manifest.append(f'{stem}.pdf')
              summary_rows.append((title, exercise_count))
              (all_dir / 'gnuplot' / stem).mkdir(parents=True, exist_ok=True)

          if total_exercises != 468:
              raise SystemExit(f'Découpage incomplet : {total_exercises} exercices au lieu de 468')

          rows = '\n'.join(f'{tex_escape(title)} & {count} exercices \\\\' for title, count in summary_rows)
          front = (
              r'\def\ModeCorriges{1}' + '\n' + preamble + r'\begin{document}' + '\n' +
              r'\frontmatter' + '\n' + r'\maketitle' + '\n' +
              r'\chapter*{Sommaire du recueil}' + '\n' +
              r'\begin{longtable}{p{0.78\linewidth}r}' + '\n' +
              r'\toprule Famille & Contenu \\ \midrule' + '\n' + rows + '\n' +
              r'\bottomrule\end{longtable}' + '\n' +
              r'\vfill\begin{center}\textbf{468 exercices avec leurs corrigés intégrés}\end{center}' + '\n' +
              r'\end{document}' + '\n'
          )
          (all_dir / 'FRONTMATTER.tex').write_text(front, encoding='utf-8')
          (all_dir / 'gnuplot' / 'FRONTMATTER').mkdir(parents=True, exist_ok=True)
          (all_dir / 'PDF_PARTS_ORDER.txt').write_text('FRONTMATTER.pdf\n' + '\n'.join(manifest) + '\n', encoding='utf-8')
          print(f'{len(manifest)} familles préparées, {total_exercises} exercices.')
          PY

      - name: Compiler séparément les familles
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            FRONTMATTER.tex
            PART_*.tex
          working_directory: ALL_EXOS
          latexmk_shell_escape: true
          continue_on_error: true
          extra_system_packages: "gnuplot"
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Installer les outils PDF de fusion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfunite >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y poppler-utils
          fi

      - name: Fusionner et contrôler le PDF complet
        id: merge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd ALL_EXOS
          mapfile -t parts < PDF_PARTS_ORDER.txt
          test "${#parts[@]}" -gt 10
          for part in "${parts[@]}"; do
            test -s "$part"
            pdfinfo "$part" >/dev/null
          done
          pdfunite "${parts[@]}" ../PDF_COMPLET_EXERCICES_CORRIGES.pdf
          cd ..
          pdfinfo PDF_COMPLET_EXERCICES_CORRIGES.pdf > PDF_COMPLET_EXERCICES_CORRIGES_INFO.txt
          pages=$(awk '/^Pages:/ {print $2}' PDF_COMPLET_EXERCICES_CORRIGES_INFO.txt)
          size=$(stat -c%s PDF_COMPLET_EXERCICES_CORRIGES.pdf)
          pdftotext PDF_COMPLET_EXERCICES_CORRIGES.pdf /tmp/pdf-complet.txt
          corrections=$(grep -c 'Corrigé' /tmp/pdf-complet.txt || true)
          grep -q 'Ingénierie système' /tmp/pdf-complet.txt
          grep -q 'Outils numériques' /tmp/pdf-complet.txt
          test "$pages" -gt 450
          test "$size" -gt 1000000
          test "$corrections" -gt 400
          echo "PDF validé : $pages pages, $size octets, $corrections occurrences de Corrigé."
          echo 'pdf_ready=true' >> "$GITHUB_OUTPUT"

      - name: Publier le PDF complet
        if: steps.merge.outputs.pdf_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PDF-complet-exercices-corriges
          path: |
            PDF_COMPLET_EXERCICES_CORRIGES.pdf
            PDF_COMPLET_EXERCICES_CORRIGES_INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publier les journaux de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-compilation-pdf-complet
          path: |
            ALL_EXOS/FRONTMATTER.log
            ALL_EXOS/PART_*.log
            ALL_EXOS/PDF_PARTS_ORDER.txt
          if-no-files-found: warn
          retention-days: 30
