name: Compiler le PDF complet avec corrigés

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-complet-corriges-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.title, 'Compiler le PDF complet corrigé')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 1

      - name: Régénérer les deux index
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_all_exos.py
          python3 tools/generate_all_corriges.py
          grep -q '468 exercices' ALL_EXOS/inputs.tex
          grep -q '468 corrigés' ALL_EXOS/corriges_inputs.tex

      - name: Normaliser les retours de ligne littéraux après les titres
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          pattern = re.compile(r'^(\s*\\exer\{[^\r\n]*?\})\\n', re.MULTILINE)
          for path in Path('.').rglob('*.tex'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              updated, count = pattern.subn(r'\1\n', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append((path.as_posix(), count))
          print(f'{len(changed)} fichier(s) normalisé(s).')
          for path, count in changed:
              print(f'  {path}: {count}')
          PY

      - name: Créer le point d’entrée avec corrigés
        shell: bash
        run: |
          cat > ALL_EXOS/ALL_EXOS_CORRIGES.tex <<'EOF'
          \def\ModeCorriges{1}
          \input{ALL_EXOS.tex}
          EOF

      - name: Compiler le recueil complet
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ALL_EXOS_CORRIGES.tex
          working_directory: ALL_EXOS
          latexmk_shell_escape: true
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Publier le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation-pdf-complet
          path: |
            ALL_EXOS/ALL_EXOS_CORRIGES.log
            ALL_EXOS/ALL_EXOS_CORRIGES.fls
            ALL_EXOS/ALL_EXOS_CORRIGES.fdb_latexmk
          if-no-files-found: warn
          retention-days: 30

      - name: Vérifier et nommer le PDF
        if: steps.latex.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s ALL_EXOS/ALL_EXOS_CORRIGES.pdf
          cp ALL_EXOS/ALL_EXOS_CORRIGES.pdf PDF_COMPLET_EXERCICES_CORRIGES.pdf
          size=$(stat -c%s PDF_COMPLET_EXERCICES_CORRIGES.pdf)
          test "$size" -gt 1000000
          echo "PDF généré : $size octets"

      - name: Publier le PDF
        if: steps.latex.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PDF-complet-exercices-corriges
          path: PDF_COMPLET_EXERCICES_CORRIGES.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Signaler l’échec LaTeX
        if: steps.latex.outcome != 'success'
        shell: bash
        run: |
          echo 'La compilation LaTeX a échoué ; le journal a été publié.'
          exit 1
