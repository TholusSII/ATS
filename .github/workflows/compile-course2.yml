name: Compiler le cours 2 Modélisation des mécanismes

on:
  push:
    paths:
      - '02-Modélisation des mécanismes/Cours/**'
      - 'Style/**'
      - '.github/workflows/compile-course2.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils de contrôle
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Compiler le cours 2
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_Modelisation_Mecanismes.tex
          working_directory: 02-Modélisation des mécanismes/Cours
          latexmk_use_xelatex: false
          extra_system_packages: git
          pre_compile: |
            rm -rf /tmp/kaobook
            git clone --depth 1 https://github.com/fmarotta/kaobook.git /tmp/kaobook
        env:
          TEXINPUTS: ".:/tmp/kaobook//:"

      - name: Contrôler les pages peu remplies
        working-directory: 02-Modélisation des mécanismes/Cours
        run: |
          pdfinfo 00_Modelisation_Mecanismes.pdf > controle_pdf.txt
          mkdir -p pages_txt
          n=$(pdfinfo 00_Modelisation_Mecanismes.pdf | awk '/Pages:/ {print $2}')
          echo "Pages contenant moins de 120 caractères :" >> controle_pdf.txt
          for p in $(seq 1 "$n"); do
            pdftotext -f "$p" -l "$p" -layout 00_Modelisation_Mecanismes.pdf "pages_txt/page_${p}.txt"
            c=$(tr -d '[:space:]' < "pages_txt/page_${p}.txt" | wc -c)
            if [ "$c" -lt 120 ]; then
              echo "page $p : $c caractères" >> controle_pdf.txt
            fi
          done
          cat controle_pdf.txt

      - name: Publier le PDF et le contrôle
        uses: actions/upload-artifact@v4
        with:
          name: cours-2-modelisation-mecanismes
          path: |
            02-Modélisation des mécanismes/Cours/00_Modelisation_Mecanismes.pdf
            02-Modélisation des mécanismes/Cours/controle_pdf.txt
