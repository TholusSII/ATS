name: Inventory posters

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inventory-posters.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build detailed inventory
        shell: bash
        run: |
          {
            echo '=== DOSSIER POSTERS ==='
            if [ -d Posters ]; then
              find Posters -type f | sort
            else
              echo 'DOSSIER Posters ABSENT'
            fi
            echo
            echo '=== LATEX ==='
            find Posters -type f \( -iname '*.tex' -o -iname '*.sty' \) 2>/dev/null | sort || true
            echo
            echo '=== PDF ==='
            find Posters -type f -iname '*.pdf' 2>/dev/null | sort || true
            echo
            echo '=== IMAGES ==='
            find Posters -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.svg' -o -iname '*.eps' \) 2>/dev/null | sort || true
            echo
            echo '=== DOSSIERS DE COURS ==='
            find . -maxdepth 2 -type d -name Cours | sort
            echo
            echo '=== STYLES LIES ==='
            find Style -type f \( -iname '*poster*' -o -iname '*mind*' -o -iname '*carte*' -o -iname '*resume*' \) | sort
          } > INVENTAIRE_POSTERS.txt
      - name: Commit inventory
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add INVENTAIRE_POSTERS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Ajoute l inventaire détaillé des posters historiques [skip poster generation]'
            git pull --rebase origin main
            git push
          fi
