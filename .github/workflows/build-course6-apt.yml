name: Contrôle natif du cours 06

on:
  push:
    paths:
      - .github/workflows/build-course6-apt.yml
      - '06-Correction des Systèmes asservis/Cours/00_Correction_Systemes_Asservis.tex'
      - '06-Correction des Systèmes asservis/Cours/06_Correction_Systemes_Asservis.tex'
      - '06-Correction des Systèmes asservis/Cours/06_Correction_Systemes_Asservis_Integration.tex'
      - '06-Correction des Systèmes asservis/Cours/sources/**'
      - '06-Correction des Systèmes asservis/Cours/pandoc/images/**'
      - 'Style/TLCorrectionSystemesAsservis.sty'
      - 'Style/TLSystemesAsservis.sty'
      - 'Style/TLSystemesAsservisStableBode.sty'
      - 'Style/schemabloc.sty'
      - 'Style/bodegraph.sty'
      - 'Style/Notations_*.sty'

permissions:
  contents: write

concurrency:
  group: build-course6-apt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publier le démarrage
        shell: bash
        run: |
          set -euo pipefail
          course='06-Correction des Systèmes asservis/Cours'
          printf 'RUNNING\n' > "$course/COMPILATION_COURS6_APT.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$course/COMPILATION_COURS6_APT.txt"
          if ! git diff --cached --quiet; then
            git commit -m 'Démarre le contrôle natif du cours 06 [skip ci]'
            git push
          fi

      - name: Installer TeX Live
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-lang-french \
            texlive-pictures texlive-science texlive-extra-utils latexmk

      - name: Compiler et conserver le diagnostic
        shell: bash
        run: |
          set +e
          course='06-Correction des Systèmes asservis/Cours'
          cd "$course"
          job='00_Correction_Systemes_Asservis'
          rm -f "$job".{aux,toc,out,mw,idx,ilg,ind,log,pdf}
          : > COMPILATION_COURS6_APT.log

          pdflatex -file-line-error -halt-on-error -interaction=nonstopmode "$job.tex" > COMPILATION_COURS6_APT.log 2>&1
          status=$?
          if [ "$status" -eq 0 ] && [ -f "$job.idx" ]; then
            makeindex "$job.idx" >> COMPILATION_COURS6_APT.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            pdflatex -file-line-error -halt-on-error -interaction=nonstopmode "$job.tex" >> COMPILATION_COURS6_APT.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            pdflatex -file-line-error -halt-on-error -interaction=nonstopmode "$job.tex" >> COMPILATION_COURS6_APT.log 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            printf 'SUCCESS\n' > COMPILATION_COURS6_APT.txt
          else
            printf 'FAILURE\n' > COMPILATION_COURS6_APT.txt
          fi
          exit 0

      - name: Publier le résultat
        shell: bash
        run: |
          set -euo pipefail
          course='06-Correction des Systèmes asservis/Cours'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$course/COMPILATION_COURS6_APT.txt" "$course/COMPILATION_COURS6_APT.log"
          if grep -qx 'SUCCESS' "$course/COMPILATION_COURS6_APT.txt"; then
            git add "$course/00_Correction_Systemes_Asservis.pdf"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Met à jour le contrôle natif du cours 06 [skip ci]'
            git push
          fi

      - name: Signaler l’échec
        shell: bash
        run: |
          grep -qx 'SUCCESS' '06-Correction des Systèmes asservis/Cours/COMPILATION_COURS6_APT.txt'
