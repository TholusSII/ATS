name: Compiler le cours 06 correction des systèmes asservis

on:
  push:
    paths:
      - .github/workflows/build-course6.yml
      - '06-Correction des Systèmes asservis/Cours/00_Correction_Systemes_Asservis.tex'
      - '06-Correction des Systèmes asservis/Cours/06_Correction_Systemes_Asservis.tex'
      - '06-Correction des Systèmes asservis/Cours/06_Correction_Systemes_Asservis_Integration.tex'
      - '06-Correction des Systèmes asservis/Cours/sources/**'
      - '06-Correction des Systèmes asservis/Cours/pandoc/images/**'
      - 'Style/TLCorrectionSystemesAsservis.sty'
      - 'Style/TLSystemesAsservis.sty'
      - 'Style/TLSystemesAsservisStableBode.sty'
      - 'Style/schemabloc.sty'
      - 'Style/bodegraph.sty'
      - 'Style/Notations_*.sty'

permissions:
  contents: write

concurrency:
  group: build-course6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publier le démarrage
        shell: bash
        run: |
          set -euo pipefail
          course='06-Correction des Systèmes asservis/Cours'
          printf 'RUNNING\nRUN_ID=%s\n' "$GITHUB_RUN_ID" > "$course/COMPILATION_COURS6.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$course/COMPILATION_COURS6.txt"
          if ! git diff --cached --quiet; then
            git commit -m 'Démarre le contrôle du cours 06 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Compiler dans TeX Live
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          course='06-Correction des Systèmes asservis/Cours'
          log="$course/COMPILATION_COURS6.log"
          : > "$log"
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/work" \
            -w "/work/$course" \
            -e 'TEXINPUTS=/work/Style//:' \
            ghcr.io/xu-cheng/texlive-full:latest \
            -lc '
              set -euo pipefail
              TEXCMD=$(find / -name pdflatex 2>/dev/null | head -n 1)
              test -n "$TEXCMD"
              TEXREAL=$(readlink -f "$TEXCMD")
              export PATH="$(dirname "$TEXREAL"):$PATH"
              job=00_Correction_Systemes_Asservis
              echo "PWD=$(pwd)"
              echo "PDFLATEX=$(command -v pdflatex)"
              echo "TEXINPUTS=$TEXINPUTS"
              kpsewhich kaobook.cls || true
              rm -f "$job".{aux,toc,out,mw,idx,ilg,ind,log,pdf}
              pdflatex -file-line-error -halt-on-error -interaction=nonstopmode "$job.tex"
              if [ -f "$job.idx" ]; then makeindex "$job.idx"; fi
              pdflatex -file-line-error -halt-on-error -interaction=nonstopmode "$job.tex"
              pdflatex -file-line-error -halt-on-error -interaction=nonstopmode "$job.tex"
            ' > "$log" 2>&1
          status=$?
          cat "$log"
          exit "$status"

      - name: Enregistrer le résultat
        shell: bash
        run: |
          set -euo pipefail
          course='06-Correction des Systèmes asservis/Cours'
          if [ '${{ steps.compile.outcome }}' = 'success' ]; then
            printf 'SUCCESS\nRUN_ID=%s\n' "$GITHUB_RUN_ID" > "$course/COMPILATION_COURS6.txt"
          else
            printf 'FAILURE\nRUN_ID=%s\n' "$GITHUB_RUN_ID" > "$course/COMPILATION_COURS6.txt"
          fi
          if [ ! -s "$course/COMPILATION_COURS6.log" ]; then
            printf 'Aucun journal de compilation n a été produit.\n' > "$course/COMPILATION_COURS6.log"
          fi

      - name: Publier le résultat
        shell: bash
        run: |
          set -euo pipefail
          course='06-Correction des Systèmes asservis/Cours'
          cp "$course/COMPILATION_COURS6.txt" /tmp/COMPILATION_COURS6.txt
          cp "$course/COMPILATION_COURS6.log" /tmp/COMPILATION_COURS6.log
          if [ -f "$course/00_Correction_Systemes_Asservis.pdf" ]; then
            cp "$course/00_Correction_Systemes_Asservis.pdf" /tmp/00_Correction_Systemes_Asservis.pdf
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD
          git pull --rebase origin main

          cp /tmp/COMPILATION_COURS6.txt "$course/COMPILATION_COURS6.txt"
          cp /tmp/COMPILATION_COURS6.log "$course/COMPILATION_COURS6.log"
          if [ '${{ steps.compile.outcome }}' = 'success' ] && [ -f /tmp/00_Correction_Systemes_Asservis.pdf ]; then
            cp /tmp/00_Correction_Systemes_Asservis.pdf "$course/00_Correction_Systemes_Asservis.pdf"
          fi

          git add "$course/COMPILATION_COURS6.txt"
          git add -f "$course/COMPILATION_COURS6.log"
          if [ '${{ steps.compile.outcome }}' = 'success' ] && [ -f "$course/00_Correction_Systemes_Asservis.pdf" ]; then
            git add -f "$course/00_Correction_Systemes_Asservis.pdf"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Met à jour le contrôle de compilation du cours 06 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Signaler l’échec
        if: steps.compile.outcome != 'success'
        run: exit 1
