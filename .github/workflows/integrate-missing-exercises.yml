name: Intégrer les exercices manquants

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.pull_request.title, '85 exercices manquants')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer la branche d’intégration
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Récupérer la banque publique complète
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ExercicesCompetences
          git clone --filter=blob:none --no-checkout https://github.com/xpessoles/ExercicesCompetences.git /tmp/ExercicesCompetences
          git -C /tmp/ExercicesCompetences checkout 5cb4eced77ae479b10715249c87afbba183d26e4

      - name: Copier les neuf exercices complets de la banque
        shell: bash
        run: |
          set -euo pipefail
          folders=(
            B2_ProposerModele/B2_16_Hyperstatisme/69_TrainA350
            B2_ProposerModele/B2_16_Hyperstatisme/71_Robovolc_02
            B2_ProposerModele/B2_16_Hyperstatisme/72_Tripteor
            B2_ProposerModele/B2_16_Hyperstatisme/81_Piaggio
            B2_ProposerModele/B2_16_Hyperstatisme/82_MAV
            B2_ProposerModele/B2_16_Hyperstatisme/83_Roburoc
            B2_ProposerModele/B2_16_Hyperstatisme/84_Nacelle
            C2_MettreEnOeuvreDemarche/C2_07_PFS/515_Divers_Potence
            C2_MettreEnOeuvreDemarche/C2_07_PFS/56_RobotAvion
          )
          for folder in "${folders[@]}"; do
            test -d "/tmp/ExercicesCompetences/$folder"
            mkdir -p "$(dirname "$folder")"
            rm -rf "$folder"
            cp -a "/tmp/ExercicesCompetences/$folder" "$folder"
          done

      - name: Restaurer les sources et les corrigés du ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat tools/vendor/missing_exercises_text.tar.xz.b64.part-* \
            | base64 --decode > /tmp/missing_exercises_text.tar.xz
          echo 'c366add28ef1992cafec6a8b2ef3e2f3ade3a1962b83d0f1fe40743763b11571  /tmp/missing_exercises_text.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/missing_exercises_text.tar.xz -C .
          python3 tools/patch_style_version.py

      - name: Restaurer les illustrations de A_Integrer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          from collections import defaultdict
          from pathlib import Path

          repo = Path.cwd()
          upstream = Path('/tmp/ExercicesCompetences')
          mapping = json.loads((repo / 'tools/a_integrer_candidate_map.json').read_text(encoding='utf-8'))
          extensions = ('.png', '.jpg', '.jpeg', '.pdf', '.eps', '.ps')
          graphics = re.compile(r'\\includegraphics(?:\[[^\]]*\])?\{([^}]+)\}')

          def resource_files(root: Path):
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix.lower() not in {'.tex', '.aux', '.log'}:
                      yield path

          by_name: dict[str, list[Path]] = defaultdict(list)
          by_stem: dict[str, list[Path]] = defaultdict(list)
          for root in (repo, upstream):
              for path in resource_files(root):
                  if '.git' in path.parts or 'tools/vendor' in path.as_posix():
                      continue
                  by_name[path.name.lower()].append(path)
                  by_stem[path.stem.lower()].append(path)

          resolved: list[tuple[str, str, str]] = []
          unresolved: list[tuple[str, str]] = []

          def score(path: Path, source: Path, preferred: Path | None) -> tuple[int, int, int]:
              source_tokens = set(re.findall(r'[a-z0-9]+', source.parent.as_posix().lower()))
              path_tokens = set(re.findall(r'[a-z0-9]+', path.as_posix().lower()))
              overlap = len(source_tokens & path_tokens)
              preferred_bonus = 0
              if preferred is not None:
                  try:
                      path.relative_to(preferred)
                      preferred_bonus = 100
                  except ValueError:
                      pass
              repo_bonus = 5 if repo in path.parents else 0
              return preferred_bonus, overlap, repo_bonus

          for source_rel, candidate_rel in mapping.items():
              source = repo / source_rel
              if not source.exists():
                  raise FileNotFoundError(source)
              candidate_dir = (repo / candidate_rel).parent
              target_dir = source.parent

              if candidate_dir.exists():
                  for item in resource_files(candidate_dir):
                      rel = item.relative_to(candidate_dir)
                      destination = target_dir / rel
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      if not destination.exists():
                          shutil.copy2(item, destination)
                      flat = target_dir / item.name
                      if not flat.exists():
                          shutil.copy2(item, flat)

              text = source.read_text(encoding='utf-8', errors='ignore')
              for raw_ref in graphics.findall(text):
                  ref = raw_ref.strip().replace('\\detokenize{', '').rstrip('}')
                  if not ref or any(char in ref for char in ('#', '\\', '$')):
                      continue
                  requested = target_dir / ref
                  existing = [requested] if requested.suffix else [requested.with_suffix(ext) for ext in extensions]
                  if any(path.exists() for path in existing):
                      continue

                  key_name = Path(ref).name.lower()
                  key_stem = Path(ref).stem.lower()
                  candidates = list(by_name.get(key_name, []))
                  if not candidates:
                      candidates = [p for p in by_stem.get(key_stem, []) if p.suffix.lower() in extensions]
                  if not candidates:
                      unresolved.append((source_rel, ref))
                      continue

                  selected = max(candidates, key=lambda p: score(p, source, candidate_dir if candidate_dir.exists() else None))
                  destination = requested if requested.suffix else requested.with_suffix(selected.suffix.lower())
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(selected, destination)
                  resolved.append((source_rel, ref, str(selected.relative_to(repo) if repo in selected.parents else selected.relative_to(upstream))))

          report = [
              '# Restauration des illustrations', '',
              f'- Références restaurées automatiquement : **{len(resolved)}**',
              f'- Références restant sans ressource : **{len(unresolved)}**', ''
          ]
          if unresolved:
              report.extend(['## Références non résolues', ''])
              report.extend(f'- `{source}` : `{ref}`' for source, ref in unresolved)
          else:
              report.append('Toutes les références graphiques détectées disposent d’un fichier exploitable.')
          (repo / 'IMAGE_RESOLUTION_REPORT.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report[:5]))
          PY

      - name: Vérifier les 468 exercices et leurs corrigés
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_corrections.py
          python3 tools/generate_all_exos.py
          python3 tools/generate_all_corriges.py
          test "$(find . -type f -name corrige.tex | wc -l)" -eq 468
          test "$(grep -RIl --include='*.tex' '\\InclureCorrige{corrige.tex}' A_Integrer B2_ProposerModele C2_MettreEnOeuvreDemarche CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC | wc -l)" -eq 468
          ! grep -RIl --include='corrige.tex' '\\CorrigeACompleter' A_Integrer B2_ProposerModele C2_MettreEnOeuvreDemarche CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC
          grep -q 'Exercices traités : \*\*468\*\*' CORRECTIONS_REPORT.md
          grep -q 'Corrigés restant partiels : \*\*0\*\*' CORRECTIONS_REPORT.md
          grep -q '468 exercices' ALL_EXOS/inputs.tex
          grep -q '468 corrigés' ALL_EXOS/corriges_inputs.tex

      - name: Enregistrer les exercices sur la branche
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/vendor/missing_exercises_text.tar.xz.b64 \
            tools/vendor/missing_exercises_text.tar.xz.b64.part-* \
            tools/a_integrer_candidate_map.json INTEGRATION_TRIGGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Intégrer les 85 exercices manquants avec leurs corrigés [skip ci]'
          git push origin HEAD:"$TARGET_BRANCH"
