name: Compiler le cours 14 logique SED

on:
  push:
    paths:
      - '14-Logique/Cours/**'
      - 'Style/**'
      - '.github/workflows/compile-course14.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le cours 14
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_Logique_SED.tex
          working_directory: 14-Logique/Cours
          latexmk_use_xelatex: false
          extra_system_packages: git
          pre_compile: |
            rm -rf /tmp/kaobook
            git clone --depth 1 https://github.com/fmarotta/kaobook.git /tmp/kaobook
        env:
          TEXINPUTS: ".:/tmp/kaobook//:"

      - name: Publier le PDF
        uses: actions/upload-artifact@v4
        with:
          name: cours-14-logique-sed
          path: 14-Logique/Cours/00_Logique_SED.pdf
