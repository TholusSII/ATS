name: Compiler le cours 13 MAS MS

on:
  push:
    paths:
      - '13-MAS-MS/Cours/**'
      - 'Style/**'
      - '.github/workflows/compile-course13.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le cours 13
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_MAS_MS.tex
          working_directory: 13-MAS-MS/Cours
          latexmk_use_xelatex: false
          extra_system_packages: git
          pre_compile: |
            rm -rf /tmp/kaobook
            git clone --depth 1 https://github.com/fmarotta/kaobook.git /tmp/kaobook
        env:
          TEXINPUTS: ".:/tmp/kaobook//:"

      - name: Publier le PDF
        uses: actions/upload-artifact@v4
        with:
          name: cours-13-mas-ms
          path: 13-MAS-MS/Cours/00_MAS_MS.pdf
