name: Diagnostiquer le paquet des exercices manquants

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.pull_request.title, '85 exercices manquants')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Mesurer et tester les fragments
        shell: bash
        run: |
          set +e
          report=PACKAGE_DIAGNOSTIC.md
          {
            echo '# Diagnostic du paquet textuel'
            echo
            echo '## Fragments'
            echo
            for file in tools/vendor/missing_exercises_text.tar.xz.b64.part-*; do
              printf -- '- `%s` : **%s caractères**\n' "$file" "$(wc -c < "$file")"
            done
            echo
            cat tools/vendor/missing_exercises_text.tar.xz.b64.part-* | tr -d '\r\n\t ' > /tmp/all.b64
            echo "- Base64 concaténé : **$(wc -c < /tmp/all.b64) caractères**"
            echo "- SHA-256 Base64 : \`$(sha256sum /tmp/all.b64 | cut -d' ' -f1)\`"
            if base64 --decode /tmp/all.b64 > /tmp/archive.tar.xz 2>/tmp/base64.err; then
              echo '- Décodage Base64 : **réussi**'
              echo "- Archive décodée : **$(wc -c < /tmp/archive.tar.xz) octets**"
              echo "- SHA-256 archive : \`$(sha256sum /tmp/archive.tar.xz | cut -d' ' -f1)\`"
              if xz --test /tmp/archive.tar.xz 2>/tmp/xz.err; then
                echo '- Contrôle XZ : **réussi**'
              else
                echo '- Contrôle XZ : **échec**'
                echo
                echo '```text'
                cat /tmp/xz.err
                echo '```'
              fi
            else
              echo '- Décodage Base64 : **échec**'
              echo
              echo '```text'
              cat /tmp/base64.err
              echo '```'
            fi
          } > "$report"
          cat "$report"

      - name: Enregistrer le diagnostic
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PACKAGE_DIAGNOSTIC.md
          git commit -m 'Diagnostiquer le paquet des exercices manquants [skip ci]'
          git push origin HEAD:"$TARGET_BRANCH"
