name: Compiler le cours 09 MCC

on:
  push:
    paths:
      - '09-MCC/Cours/**'
      - 'Style/**'
      - '.github/workflows/compile-course9.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le cours 09
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_MCC.tex
          working_directory: 09-MCC/Cours
          latexmk_use_xelatex: false
          extra_system_packages: git
          pre_compile: |
            rm -rf /tmp/kaobook
            git clone --depth 1 https://github.com/fmarotta/kaobook.git /tmp/kaobook
        env:
          TEXINPUTS: ".:/tmp/kaobook//:"

      - name: Publier le PDF
        uses: actions/upload-artifact@v4
        with:
          name: cours-09-mcc
          path: 09-MCC/Cours/00_MCC.pdf
