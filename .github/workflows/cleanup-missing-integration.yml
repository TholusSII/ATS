name: Nettoyer l’intégration temporaire

on:
  push:
    branches: [main]
    paths:
      - CLEANUP_INTEGRATION_TRIGGER.md

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Supprimer les fichiers temporaires
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/integrate-missing-exercises.yml \
            .github/workflows/integrate-missing-exercises-direct.yml \
            .github/workflows/diagnose-missing-package.yml \
            .github/workflows/cleanup-missing-integration.yml \
            CLEANUP_INTEGRATION_TRIGGER.md \
            DIRECT_INTEGRATION_TRIGGER.md \
            PACKAGE_DIAGNOSTIC.md \
            INTEGRATION_TRIGGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Nettoyer les fichiers temporaires d’intégration [skip ci]'
          git push origin HEAD:main
