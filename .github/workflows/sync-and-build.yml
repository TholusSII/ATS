name: Synchroniser et compiler les exercices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-and-build.yml
      - ALL_EXOS/ALL_EXOS.tex
      - ALL_EXOS/ALL_EXOS_CORRIGE.tex
      - Style/exercices_compat.tex
      - tools/**

permissions:
  contents: write

concurrency:
  group: exercices-${{ github.ref }}
  cancel-in-progress: true

env:
  # Révision correspondant au lot DYN.zip fourni.
  EXERCISES_REF: bf8b5cb7d16db996022c1647f22b2203943a922b
  # Framework officiel xpessoles/Style, complété par exercices_compat.tex.
  STYLE_REF: dcc5a8ac942668b246087cfd624ecadc8e17af6f

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Récupérer le dépôt Exercices
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Récupérer les révisions sources figées
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/PSI_ExercicesCompetences /tmp/Style

          git init -q /tmp/PSI_ExercicesCompetences
          git -C /tmp/PSI_ExercicesCompetences remote add origin https://github.com/xpessoles/PSI_ExercicesCompetences.git
          git -C /tmp/PSI_ExercicesCompetences fetch --depth 1 origin "$EXERCISES_REF"
          git -C /tmp/PSI_ExercicesCompetences checkout -q --detach FETCH_HEAD

          git init -q /tmp/Style
          git -C /tmp/Style remote add origin https://github.com/xpessoles/Style.git
          git -C /tmp/Style fetch --depth 1 origin "$STYLE_REF"
          git -C /tmp/Style checkout -q --detach FETCH_HEAD

      - name: Synchroniser les dossiers du ZIP et le framework Style
        shell: bash
        run: |
          set -euo pipefail
          source_dirs=(
            CIN COR DYN ELEC FULL_PDF GEO NUM PERF PPM RDM
            SEQ SLCI STAT SYS TEC scripts xx_Figures
          )

          rm -rf CHS "${source_dirs[@]}"
          for dir in "${source_dirs[@]}"; do
            test -d "/tmp/PSI_ExercicesCompetences/$dir"
            cp -a "/tmp/PSI_ExercicesCompetences/$dir" ./
          done

          cp Style/exercices_compat.tex /tmp/exercices_compat.tex
          rm -rf Style framework resources
          mkdir -p Style
          rsync -a --exclude='.git/' /tmp/Style/ Style/
          cp /tmp/exercices_compat.tex Style/exercices_compat.tex

          printf '%s\n' \
            '# Sources figées' \
            '' \
            "- Exercices : xpessoles/PSI_ExercicesCompetences - $EXERCISES_REF" \
            "- Framework : xpessoles/Style - $STYLE_REF" \
            '- La révision des exercices correspond au lot fourni dans DYN.zip.' \
            > SOURCE_XPESSOLES.md

      - name: Appliquer les correctifs minimaux des sources
        run: python3 tools/patch_exercises.py

      - name: Générer les fichiers de corrigé séparés
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_corrections.py
          test "$(find . -type f -name corrige.tex | wc -l)" -eq 383
          grep -q 'Exercices traités : \*\*383\*\*' CORRECTIONS_REPORT.md

      - name: Générer le fichier maître ALL_EXOS
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_all_exos.py
          grep -q '383 exercices' ALL_EXOS/inputs.tex
          mkdir -p ALL_EXOS/gnuplot/ALL_EXOS ALL_EXOS/gnuplot/ALL_EXOS_CORRIGE

      - name: Compiler les recueils avec et sans corrigés
        id: compile
        continue-on-error: true
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: ALL_EXOS
          root_file: |
            ALL_EXOS.tex
            ALL_EXOS_CORRIGE.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          texlive_version: 2025
          os: debian
          extra_system_packages: "gnuplot-nox"
          latexmk_shell_escape: true
          continue_on_error: true
          pre_compile: |
            mkdir -p gnuplot/ALL_EXOS gnuplot/ALL_EXOS_CORRIGE

      - name: Enregistrer le diagnostic et l'état de compilation
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p ALL_EXOS
          : > ALL_EXOS/BUILD_ERRORS.txt

          while IFS= read -r log; do
            printf '\n===== %s =====\n' "$log" >> ALL_EXOS/BUILD_ERRORS.txt
            grep -n -E -C 5 '(^!|LaTeX Error|Package .* Error|Undefined control sequence|Emergency stop|Fatal error|not found|File .* not found|Runaway argument)' "$log" >> ALL_EXOS/BUILD_ERRORS.txt || true
            printf '\n----- fin du journal -----\n' >> ALL_EXOS/BUILD_ERRORS.txt
            tail -n 180 "$log" >> ALL_EXOS/BUILD_ERRORS.txt || true
          done < <(find . -type f -name '*.log' -print | sort)

          if [ "${{ steps.compile.outcome }}" = "success" ] \
             && [ -s ALL_EXOS/ALL_EXOS.pdf ] \
             && [ -s ALL_EXOS/ALL_EXOS_CORRIGE.pdf ]; then
            {
              printf '# État de compilation\n\n'
              printf '✅ Les deux recueils ont été compilés avec succès.\n\n'
              printf -- '- `ALL_EXOS/ALL_EXOS.pdf` : énoncés seuls ;\n'
              printf -- '- `ALL_EXOS/ALL_EXOS_CORRIGE.pdf` : énoncés et boxes de corrigé.\n\n'
              sed -n '3,8p' CORRECTIONS_REPORT.md
            } > ALL_EXOS/BUILD_STATUS.md
            rm -f ALL_EXOS/BUILD_ERRORS.txt
          else
            printf '# État de compilation\n\n❌ La compilation a échoué. Le diagnostic est enregistré dans `ALL_EXOS/BUILD_ERRORS.txt`.\n' > ALL_EXOS/BUILD_STATUS.md
            if [ ! -s ALL_EXOS/BUILD_ERRORS.txt ]; then
              printf 'Aucun journal LaTeX n’a été produit. Vérifier les étapes précédentes du workflow.\n' > ALL_EXOS/BUILD_ERRORS.txt
            fi
          fi

      - name: Publier les PDF et les journaux comme artefact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ALL_EXOS
          path: |
            ALL_EXOS/ALL_EXOS.pdf
            ALL_EXOS/ALL_EXOS_CORRIGE.pdf
            ALL_EXOS/BUILD_STATUS.md
            ALL_EXOS/BUILD_ERRORS.txt
            ALL_EXOS/*.log
            CORRECTIONS_REPORT.md
          if-no-files-found: ignore

      - name: Nettoyer les fichiers temporaires de compilation
        if: always()
        shell: bash
        run: |
          rm -rf ALL_EXOS/gnuplot
          find ALL_EXOS -maxdepth 1 -type f \
            \( -name '*.aux' -o -name '*.fdb_latexmk' -o -name '*.fls' \
               -o -name '*.idx' -o -name '*.ilg' -o -name '*.ind' \
               -o -name '*.log' -o -name '*.out' -o -name '*.toc' \) -delete

      - name: Enregistrer les exercices, les corrigés et les PDF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
          else
            git commit -m "Générer les corrigés et compiler les recueils [skip ci]"
            git push origin HEAD:main
          fi

      - name: Signaler une compilation incomplète
        if: steps.compile.outcome != 'success'
        run: exit 1
