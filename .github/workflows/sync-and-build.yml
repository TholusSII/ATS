name: Synchroniser et compiler les exercices

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-and-build.yml

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}

    steps:
      - name: Récupérer le dépôt Exercices
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Récupérer la source xpessoles
        run: |
          rm -rf /tmp/PSI_ExercicesCompetences
          git clone --depth 1 https://github.com/xpessoles/PSI_ExercicesCompetences.git /tmp/PSI_ExercicesCompetences

      - name: Copier les dossiers d'exercices
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='ALL_EXOS/' \
            /tmp/PSI_ExercicesCompetences/ ./

      - name: Générer ALL_EXOS
        run: python3 scripts/generate_all_exos.py

      - name: Compiler le recueil TeX
        id: compile
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ALL_EXOS/ALL_EXOS.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Conserver le diagnostic LaTeX
        if: always()
        run: |
          mkdir -p ALL_EXOS
          : > ALL_EXOS/BUILD_ERRORS.txt
          while IFS= read -r log; do
            printf '\n===== %s =====\n' "$log" >> ALL_EXOS/BUILD_ERRORS.txt
            grep -n -E -C 4 '(^!|LaTeX Error|Package .* Error|Undefined control sequence|Emergency stop|Fatal error|not found|File .* not found)' "$log" >> ALL_EXOS/BUILD_ERRORS.txt || true
            printf '\n----- fin du journal -----\n' >> ALL_EXOS/BUILD_ERRORS.txt
            tail -n 120 "$log" >> ALL_EXOS/BUILD_ERRORS.txt || true
          done < <(find . -type f -name '*.log' -print | sort)
          if [ ! -s ALL_EXOS/BUILD_ERRORS.txt ]; then
            printf 'Aucun fichier .log trouvé dans l’espace de travail.\n' > ALL_EXOS/BUILD_ERRORS.txt
          fi

      - name: Écrire l'état de compilation
        if: always()
        run: |
          if [ "${{ steps.compile.outcome }}" = "success" ]; then
            printf '# État de compilation\n\n✅ `ALL_EXOS/ALL_EXOS.tex` a été compilé avec succès.\n' > ALL_EXOS/BUILD_STATUS.md
          else
            printf '# État de compilation\n\n❌ La compilation a échoué. Le diagnostic est enregistré dans `ALL_EXOS/BUILD_ERRORS.txt`.\n' > ALL_EXOS/BUILD_STATUS.md
          fi

      - name: Enregistrer les dossiers, le framework et le recueil
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Synchroniser les exercices xpessoles et générer ALL_EXOS [skip ci]"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Publier les journaux de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-all-exos
          path: |
            **/*.log
            **/*.fls
            **/*.fdb_latexmk
            ALL_EXOS/BUILD_ERRORS.txt
          if-no-files-found: ignore
