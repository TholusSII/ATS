name: Synchroniser et compiler les exercices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-and-build.yml
      - ALL_EXOS/ALL_EXOS.tex
      - Style/exercices_compat.tex
      - tools/**

permissions:
  contents: write

concurrency:
  group: exercices-${{ github.ref }}
  cancel-in-progress: true

env:
  # Révision correspondant au lot DYN.zip fourni.
  EXERCISES_REF: bf8b5cb7d16db996022c1647f22b2203943a922b
  # Framework officiel xpessoles/Style, avec sa correction TeX récente.
  STYLE_REF: dcc5a8ac942668b246087cfd624ecadc8e17af6f

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Récupérer le dépôt Exercices
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Récupérer les révisions sources figées
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/PSI_ExercicesCompetences /tmp/Style

          git init -q /tmp/PSI_ExercicesCompetences
          git -C /tmp/PSI_ExercicesCompetences remote add origin https://github.com/xpessoles/PSI_ExercicesCompetences.git
          git -C /tmp/PSI_ExercicesCompetences fetch --depth 1 origin "$EXERCISES_REF"
          git -C /tmp/PSI_ExercicesCompetences checkout -q --detach FETCH_HEAD

          git init -q /tmp/Style
          git -C /tmp/Style remote add origin https://github.com/xpessoles/Style.git
          git -C /tmp/Style fetch --depth 1 origin "$STYLE_REF"
          git -C /tmp/Style checkout -q --detach FETCH_HEAD

      - name: Synchroniser les dossiers du ZIP et le framework Style
        shell: bash
        run: |
          set -euo pipefail
          source_dirs=(
            CIN COR DYN ELEC FULL_PDF GEO NUM PERF PPM RDM
            SEQ SLCI STAT SYS TEC scripts xx_Figures
          )

          # CHS provenait d'une synchronisation ultérieure et n'appartient pas au ZIP fourni.
          rm -rf CHS "${source_dirs[@]}"
          for dir in "${source_dirs[@]}"; do
            test -d "/tmp/PSI_ExercicesCompetences/$dir"
            cp -a "/tmp/PSI_ExercicesCompetences/$dir" ./
          done

          # Conserve la couche de compatibilité du recueil et remplace le reste par
          # le framework officiel issu du répertoire Style.
          cp Style/exercices_compat.tex /tmp/exercices_compat.tex
          rm -rf Style framework resources
          mkdir -p Style
          rsync -a --exclude='.git/' /tmp/Style/ Style/
          cp /tmp/exercices_compat.tex Style/exercices_compat.tex

          cat > SOURCE_XPESSOLES.md <<EOF
          # Sources figées

          - Exercices : `xpessoles/PSI_ExercicesCompetences` — `$EXERCISES_REF`
          - Framework : `xpessoles/Style` — `$STYLE_REF`
          - La révision des exercices correspond au lot fourni dans `DYN.zip`.
          EOF

      - name: Appliquer les correctifs minimaux des sources
        run: python3 tools/patch_exercises.py

      - name: Générer le fichier maître ALL_EXOS
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_all_exos.py
          grep -q '383 exercices' ALL_EXOS/inputs.tex

      - name: Compiler le recueil TeX
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: ALL_EXOS
          root_file: ALL_EXOS.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          texlive_version: 2025
          os: debian

      - name: Vérifier et publier le PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s ALL_EXOS/ALL_EXOS.pdf
          printf '# État de compilation\n\n✅ `ALL_EXOS/ALL_EXOS.tex` a été compilé avec succès.\n' > ALL_EXOS/BUILD_STATUS.md
          rm -f ALL_EXOS/BUILD_ERRORS.txt

      - name: Publier le PDF comme artefact
        uses: actions/upload-artifact@v6
        with:
          name: ALL_EXOS
          path: |
            ALL_EXOS/ALL_EXOS.pdf
            ALL_EXOS/BUILD_STATUS.md
          if-no-files-found: error

      - name: Enregistrer les exercices, le framework et le PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git commit -m "Synchroniser DYN et compiler ALL_EXOS [skip ci]"
          git push origin HEAD:main
