name: Convertir les vecteurs Introduction SA

on:
  push:
    paths:
      - .github/workflows/convert-course5-intro-vectors.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Inkscape
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape

      - name: Convertir tous les EMF et WMF en PDF
        shell: bash
        run: |
          set -euo pipefail
          img='05-Modélisation Systèmes Asservis/Cours/images'
          find "$img" -type f \( -iname '*.emf' -o -iname '*.wmf' \) -print0 |
          while IFS= read -r -d '' file; do
            pdf="${file%.*}.pdf"
            if [ ! -s "$pdf" ]; then
              inkscape "$file" --export-filename="$pdf"
            fi
          done

      - name: Supprimer le workflow et publier
        shell: bash
        run: |
          git rm .github/workflows/convert-course5-intro-vectors.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '05-Modélisation Systèmes Asservis/Cours/images'
          git commit -m 'Convertit les vecteurs Introduction SA en PDF'
          git push
