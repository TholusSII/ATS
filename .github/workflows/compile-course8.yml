name: Compiler le cours 08 électromécanique

on:
  push:
    paths:
      - '08-Électromécanique/Cours/**'
      - 'Style/**'
      - '.github/workflows/compile-course8.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le cours 08
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_Electromecanique.tex
          working_directory: 08-Électromécanique/Cours
          latexmk_use_xelatex: false
          extra_system_packages: git
          pre_compile: |
            rm -rf /tmp/kaobook
            git clone --depth 1 https://github.com/fmarotta/kaobook.git /tmp/kaobook
        env:
          TEXINPUTS: ".:/tmp/kaobook//:"

      - name: Publier le PDF
        uses: actions/upload-artifact@v4
        with:
          name: cours-08-electromecanique
          path: 08-Électromécanique/Cours/00_Electromecanique.pdf
