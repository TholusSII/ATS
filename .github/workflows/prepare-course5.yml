name: Préparer le cours 05 systèmes asservis

on:
  push:
    paths:
      - .github/workflows/prepare-course5.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convertir le cours de modélisation
        shell: bash
        run: |
          set -euo pipefail
          course='05-Modélisation Systèmes Asservis/Cours'
          target="$course/modelisation"
          rm -rf "$target"
          mkdir -p "$target"
          (
            cd "$target"
            pandoc '../8-ModelisationSA2023.docx' \
              --from=docx \
              --to=latex \
              --wrap=preserve \
              --extract-media=. \
              --output=contenu.tex
            if [ -d media ]; then
              mv media images
              sed -i 's#media/#images/#g' contenu.tex
            fi
          )

      - name: Analyser la structure des deux cours
        shell: bash
        run: |
          set -euo pipefail
          course='05-Modélisation Systèmes Asservis/Cours'
          {
            echo '=== INTRODUCTION SA ==='
            wc -l "$course/contenu.tex"
            grep -nE '^\\(section|subsection|subsubsection)' "$course/contenu.tex" || true
            echo
            echo '=== REPÈRES INTRODUCTION ==='
            grep -nEi 'exercices du chapitre|sources|annexe' "$course/contenu.tex" || true
            echo
            echo '=== MODÉLISATION SA ==='
            wc -l "$course/modelisation/contenu.tex"
            grep -nE '^\\(section|subsection|subsubsection)' "$course/modelisation/contenu.tex" || true
            echo
            echo '=== REPÈRES MODÉLISATION ==='
            grep -nEi 'exercices du chapitre|sources|annexe' "$course/modelisation/contenu.tex" || true
            echo
            echo '=== IMAGES MODÉLISATION ==='
            find "$course/modelisation/images" -type f 2>/dev/null | sort || true
          } > "$course/STRUCTURE_COURS5.txt"

      - name: Publier la première passe
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '05-Modélisation Systèmes Asservis/Cours/modelisation' \
                  '05-Modélisation Systèmes Asservis/Cours/STRUCTURE_COURS5.txt'
          git commit -m 'Ajoute la première passe du cours de modélisation SA'
          git push
