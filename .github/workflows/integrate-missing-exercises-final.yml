name: Intégration finale des 85 exercices

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: integration-finale-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.pull_request.title, '85 exercices manquants')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Récupérer la banque publique
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ExercicesCompetences
          git clone --filter=blob:none --no-checkout https://github.com/xpessoles/ExercicesCompetences.git /tmp/ExercicesCompetences
          git -C /tmp/ExercicesCompetences checkout 5cb4eced77ae479b10715249c87afbba183d26e4

      - name: Copier les neuf exercices complets
        shell: bash
        run: |
          set -euo pipefail
          folders=(
            B2_ProposerModele/B2_16_Hyperstatisme/69_TrainA350
            B2_ProposerModele/B2_16_Hyperstatisme/71_Robovolc_02
            B2_ProposerModele/B2_16_Hyperstatisme/72_Tripteor
            B2_ProposerModele/B2_16_Hyperstatisme/81_Piaggio
            B2_ProposerModele/B2_16_Hyperstatisme/82_MAV
            B2_ProposerModele/B2_16_Hyperstatisme/83_Roburoc
            B2_ProposerModele/B2_16_Hyperstatisme/84_Nacelle
            C2_MettreEnOeuvreDemarche/C2_07_PFS/515_Divers_Potence
            C2_MettreEnOeuvreDemarche/C2_07_PFS/56_RobotAvion
          )
          for folder in "${folders[@]}"; do
            test -d "/tmp/ExercicesCompetences/$folder"
            mkdir -p "$(dirname "$folder")"
            rm -rf "$folder"
            cp -a "/tmp/ExercicesCompetences/$folder" "$folder"
          done

      - name: Restaurer les 76 exercices du ZIP
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            tools/vendor/missing_exercises_text.tar.xz.b64.part-000a
            tools/vendor/missing_exercises_text.tar.xz.b64.part-000b
            tools/vendor/missing_exercises_text.tar.xz.b64.part-001
            tools/vendor/missing_exercises_text.tar.xz.b64.part-002
            tools/vendor/missing_exercises_text.tar.xz.b64.part-003
            tools/vendor/missing_exercises_text.tar.xz.b64.part-004
          )
          for part in "${parts[@]}"; do test -s "$part"; done
          cat "${parts[@]}" | tr -d '\r\n\t ' | base64 --decode > /tmp/missing_exercises_text.tar.xz
          xz --test /tmp/missing_exercises_text.tar.xz
          tar -tJf /tmp/missing_exercises_text.tar.xz >/dev/null
          tar -xJf /tmp/missing_exercises_text.tar.xz -C .
          python3 tools/patch_style_version.py

      - name: Restaurer les illustrations
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:tools/restore_a_integrer_images.py > /tmp/restore_a_integrer_images.py
          python3 /tmp/restore_a_integrer_images.py

      - name: Vérifier 468 exercices et 468 corrigés
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_corrections.py
          python3 tools/generate_all_exos.py
          python3 tools/generate_all_corriges.py
          test "$(find . -type f -name corrige.tex | wc -l)" -eq 468
          test "$(grep -RIl --include='*.tex' '\\InclureCorrige{corrige.tex}' A_Integrer B2_ProposerModele C2_MettreEnOeuvreDemarche CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC | wc -l)" -eq 468
          ! grep -RIl --include='corrige.tex' '\\CorrigeACompleter' A_Integrer B2_ProposerModele C2_MettreEnOeuvreDemarche CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC
          grep -q 'Exercices traités : \*\*468\*\*' CORRECTIONS_REPORT.md
          grep -q 'Corrigés restant partiels : \*\*0\*\*' CORRECTIONS_REPORT.md
          grep -q '468 exercices' ALL_EXOS/inputs.tex
          grep -q '468 corrigés' ALL_EXOS/corriges_inputs.tex

      - name: Enregistrer sur la branche
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/vendor/missing_exercises_text.tar.xz.b64* tools/vendor/missing_text.tar.xz.b64* tools/a_integrer_candidate_map.json INTEGRATION_TRIGGER.md PACKAGE_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Intégrer les 85 exercices manquants avec leurs corrigés [skip ci]'
          git push origin HEAD:"$TARGET_BRANCH"
