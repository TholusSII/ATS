name: Intégration finale des 85 exercices

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: integration-finale-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.pull_request.title, '85 exercices manquants')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Installer les scripts d’intégration validés
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:tools/integrate_new_exercises.py > tools/integrate_new_exercises.py
          git show origin/main:tools/materialize_new_sources.py > tools/materialize_new_sources.py
          python3 -m py_compile tools/integrate_new_exercises.py tools/materialize_new_sources.py

      - name: Matérialiser les 85 exercices et leurs ressources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_new_sources.py

      - name: Créer les 85 corrigés et régénérer les recueils
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrate_new_exercises.py
          python3 tools/generate_all_exos.py
          python3 tools/generate_all_corriges.py

      - name: Vérifier 468 exercices et 468 corrigés
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -type f -name corrige.tex | wc -l)" -eq 468
          test "$(grep -RIlF --include='*.tex' '\InclureCorrige{corrige.tex}' A_Integrer B2_ProposerModele C2_MettreEnOeuvreDemarche CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC | wc -l)" -eq 468
          ! grep -RIlF --include='corrige.tex' '\CorrigeACompleter' A_Integrer B2_ProposerModele C2_MettreEnOeuvreDemarche CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC
          grep -q 'Exercices traités : \*\*468\*\*' CORRECTIONS_REPORT.md
          grep -q 'Corrigés restant partiels : \*\*0\*\*' CORRECTIONS_REPORT.md
          grep -q 'Questions restant marquées à compléter : \*\*0\*\*' CORRECTIONS_REPORT.md
          grep -q '468 exercices' ALL_EXOS/inputs.tex
          grep -q '468 corrigés' ALL_EXOS/corriges_inputs.tex

      - name: Enregistrer sur la branche
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/vendor/missing_exercises_text.tar.xz.b64* \
            tools/vendor/missing_text.tar.xz.b64* \
            tools/a_integrer_candidate_map.json \
            INTEGRATION_TRIGGER.md PACKAGE_DIAGNOSTIC.md
          cat > REPRISE_INTEGRATION_85.md <<'EOF'
          # Intégration des 85 exercices terminée

          Les 85 exercices manquants ont été matérialisés avec leurs ressources et leurs corrigés.
          Les contrôles automatiques ont validé 468 exercices, 468 fichiers `corrige.tex`, 468 inclusions et aucun marqueur `\CorrigeACompleter`.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Intégrer les 85 exercices manquants avec leurs corrigés [skip ci]'
          git push origin HEAD:"$TARGET_BRANCH"
