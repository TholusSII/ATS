name: Inspecter les images des exercices

on:
  push:
    branches:
      - agent/aligner-framework-analyse-fonctionnelle
    paths:
      - '.github/workflows/inspect-exercise-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Construire la planche-contact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('01-Ingénierie système/Cours/images')
          candidates = []
          for path in root.glob('image*.*'):
              stem = path.stem
              try:
                  number = int(stem.replace('image', ''))
              except ValueError:
                  continue
              if 84 <= number <= 140:
                  candidates.append((number, path))
          candidates.sort()

          font = ImageFont.load_default()
          cards = []
          manifest = []
          for number, path in candidates:
              try:
                  im = Image.open(path).convert('RGB')
              except Exception as exc:
                  manifest.append(f'{path.name}\tERROR\t{exc}')
                  continue
              manifest.append(f'{path.name}\t{im.width}x{im.height}\t{path.stat().st_size}')
              max_w, max_h = 360, 290
              scale = min(max_w / im.width, max_h / im.height, 1)
              thumb = im.resize((max(1, round(im.width*scale)), max(1, round(im.height*scale))))
              card = Image.new('RGB', (390, 340), 'white')
              card.paste(thumb, ((390-thumb.width)//2, 35+(290-thumb.height)//2))
              draw = ImageDraw.Draw(card)
              draw.rectangle((0,0,389,339), outline='black')
              draw.text((8,8), path.name, fill='black', font=font)
              cards.append(card)

          cols = 4
          rows = (len(cards)+cols-1)//cols
          sheet = Image.new('RGB', (cols*390, max(1, rows)*340), 'white')
          for idx, card in enumerate(cards):
              sheet.paste(card, ((idx%cols)*390, (idx//cols)*340))
          Path('image-inspection').mkdir(exist_ok=True)
          sheet.save('image-inspection/contact.jpg', quality=92, subsampling=0)
          Path('image-inspection/manifest.txt').write_text('\n'.join(manifest)+'\n', encoding='utf-8')
          print('\n'.join(manifest))
          PY

      - name: Publier la planche-contact
        uses: actions/upload-artifact@v4
        with:
          name: images-exercices-contact
          path: image-inspection/
          if-no-files-found: error
