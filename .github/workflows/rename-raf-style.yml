name: Renommer les bibliothèques Raf

on:
  push:
    paths:
      - .github/workflows/rename-raf-style.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Renommer les bibliothèques et mettre à jour les références
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          tracked = [Path(p.decode("utf-8", errors="surrogateescape")) for p in tracked if p]

          renamed = []
          for src in tracked:
              if not src.parts or src.parts[0] != "Style":
                  continue
              if not src.name.startswith("Raf_"):
                  continue
              dst = src.with_name(src.name[len("Raf_"):])
              if dst.exists() and dst != src:
                  raise SystemExit(f"Collision détectée : {src} -> {dst}")
              dst.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", "--", str(src), str(dst)], check=True)
              renamed.append((src, dst))

          text_ext = {
              ".tex", ".sty", ".cls", ".cfg", ".def", ".md", ".txt",
              ".py", ".yml", ".yaml", ".bat", ".sh", ".json", ".toml",
              ".ini", ".bib", ".lua", ".mk", ".cmake"
          }

          tracked_after = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked_after:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", errors="surrogateescape"))
              if path.suffix.lower() not in text_ext or not path.exists():
                  continue
              data = path.read_bytes()
              if b"Raf_" in data:
                  path.write_bytes(data.replace(b"Raf_", b""))

          manifest = Path("Style/RENOMMAGE_RAF.txt")
          manifest.write_text(
              "\n".join(f"{src} -> {dst}" for src, dst in renamed) + "\n",
              encoding="utf-8"
          )

          print(f"{len(renamed)} bibliothèque(s) renommée(s).")
          for src, dst in renamed:
              print(f"{src} -> {dst}")
          PY

      - name: Retirer le workflow temporaire
        shell: bash
        run: git rm .github/workflows/rename-raf-style.yml

      - name: Publier le renommage
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Supprime le préfixe Raf des bibliothèques Style'
            git push
          fi
