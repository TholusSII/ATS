name: Inventorier les bibliothèques Raf

on:
  push:
    paths:
      - .github/workflows/rename-raf-style.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventorier les fichiers et collisions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          paths = [Path(p.decode("utf-8", errors="surrogateescape")) for p in tracked if p]
          lines = []
          for src in paths:
              if src.parts and src.parts[0] == "Style" and src.name.startswith("Raf_"):
                  dst = src.with_name(src.name[len("Raf_"):])
                  status = "COLLISION" if dst.exists() else "OK"
                  lines.append(f"{status}\t{src}\t{dst}")
          Path("Style/RENOMMAGE_RAF.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Publier l’inventaire
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Style/RENOMMAGE_RAF.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Inventorie les bibliothèques Raf de Style'
            git push
          fi
