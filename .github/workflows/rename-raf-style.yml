name: Inventorier toutes les occurrences Raf

on:
  push:
    paths:
      - .github/workflows/rename-raf-style.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventorier noms et références
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          paths = [Path(p.decode("utf-8", errors="surrogateescape")) for p in tracked if p]
          lines = ["=== NOMS DE FICHIERS ==="]
          for path in paths:
              if path.parts and path.parts[0] == "Style" and "raf" in path.name.lower():
                  lines.append(str(path))

          lines.append("")
          lines.append("=== OCCURRENCES DANS LES SOURCES ===")
          text_ext = {".tex", ".sty", ".cls", ".cfg", ".def", ".md", ".txt", ".py", ".yml", ".yaml", ".bat", ".sh", ".json", ".toml", ".ini", ".bib", ".lua"}
          for path in paths:
              if path.suffix.lower() not in text_ext or not path.exists():
                  continue
              data = path.read_bytes()
              lower = data.lower()
              if b"raf" not in lower:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  text = data.decode("latin-1")
              for number, line in enumerate(text.splitlines(), 1):
                  if "raf" in line.lower():
                      lines.append(f"{path}:{number}: {line}")

          Path("Style/RENOMMAGE_RAF.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Publier l’inventaire
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Style/RENOMMAGE_RAF.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Inventorie toutes les occurrences Raf du dépôt'
            git push
          fi
