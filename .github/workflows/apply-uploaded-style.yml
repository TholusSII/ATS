name: Appliquer le framework local joint

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/environment_v2.tex.gz'

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restaurer le fichier environment_v2.tex
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc tools/environment_v2.tex.gz > Style/environment_v2.tex
          test "$(git hash-object Style/environment_v2.tex)" = "f84e5fb2e48ce7b31484a680ccb3c73c22c9a300"
          rm tools/environment_v2.tex.gz

      - name: Enregistrer le framework local
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Style/environment_v2.tex tools/environment_v2.tex.gz
          git commit -m 'Aligner environment_v2 sur le framework local [skip ci]'
          git push origin HEAD:"$TARGET_BRANCH"
