name: Inventorier les caractères Unicode du cours 05

on:
  push:
    paths:
      - .github/workflows/scan-course5-unicode.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relever les caractères non ASCII
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          root = Path('05-Modélisation Systèmes Asservis/Cours')
          files = list((root / 'sources').glob('*.tex'))
          counts = Counter()
          samples = defaultdict(list)
          for path in files:
              text = path.read_text(encoding='utf-8')
              for lineno, line in enumerate(text.splitlines(), 1):
                  for ch in line:
                      if ord(ch) > 127:
                          counts[ch] += 1
                          if len(samples[ch]) < 3:
                              samples[ch].append(f'{path.name}:{lineno}')
          lines = []
          for ch, count in sorted(counts.items(), key=lambda item: ord(item[0])):
              lines.append(f'U+{ord(ch):04X}\t{ch!r}\t{count}\t{", ".join(samples[ch])}')
          (root / 'UNICODE_COURS5.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Publier le rapport
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '05-Modélisation Systèmes Asservis/Cours/UNICODE_COURS5.txt'
          git commit -m 'Ajoute l inventaire Unicode du cours 05'
          git push
