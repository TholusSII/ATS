name: Copier physiquement les 383 corrigés

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restaurer le moteur de complétion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from itertools import permutations
          import base64
          import gzip
          import traceback

          debug = []
          parts = sorted(Path('tools/vendor').glob('complete_missing_corrections.py.gz.b64.part-*'))
          debug.append('Fragments :')
          for part in parts:
              text = part.read_text(encoding='utf-8-sig')
              compact = ''.join(text.split())
              debug.append(f'- {part.name}: fichier={part.stat().st_size}, compact={len(compact)}, debut={compact[:24]!r}, fin={compact[-24:]!r}')

          try:
              if len(parts) != 6:
                  raise RuntimeError(f'Nombre de fragments inattendu : {len(parts)}')
              chunks = {p.name: ''.join(p.read_text(encoding='utf-8-sig').split()) for p in parts}
              restored = None
              selected = None
              failures = []
              for index, order in enumerate(permutations(parts), start=1):
                  encoded = ''.join(chunks[p.name] for p in order)
                  try:
                      compressed = base64.b64decode(encoded, validate=False)
                      script = gzip.decompress(compressed)
                  except Exception as exc:
                      if len(failures) < 12:
                          failures.append(f'{[p.name for p in order]} -> {type(exc).__name__}: {exc}')
                      continue
                  if b'def main' in script or b'CorrigeQuestion' in script:
                      restored = script
                      selected = [p.name for p in order]
                      break
              debug.append(f'Permutations testées : {index}')
              debug.extend('Échec : ' + item for item in failures)
              if restored is None:
                  raise RuntimeError('Aucune permutation ne produit une archive gzip Python valide.')
              output = Path('tools/complete_missing_corrections.py')
              output.write_bytes(restored)
              debug.append('Ordre retenu : ' + ', '.join(selected))
              debug.append(f'Taille restaurée : {len(restored)} octets')
              Path('tools/RESTORE_DEBUG.txt').write_text('\n'.join(debug) + '\n', encoding='utf-8')
          except Exception:
              debug.append('Exception finale :')
              debug.append(traceback.format_exc())
              Path('tools/RESTORE_DEBUG.txt').write_text('\n'.join(debug) + '\n', encoding='utf-8')
              raise
          PY
          chmod +x tools/complete_missing_corrections.py
          python3 -m py_compile tools/complete_missing_corrections.py

      - name: Créer les corrigés dans chaque répertoire
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_exercises.py
          python3 tools/generate_corrections.py
          python3 tools/complete_missing_corrections.py

      - name: Vérifier la matérialisation
        shell: bash
        run: |
          set -euo pipefail
          source_dirs=(CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC)
          corrige_count=$(find "${source_dirs[@]}" -type f -name corrige.tex | wc -l)
          include_count=$(grep -RIl --include='*.tex' '\\InclureCorrige{corrige.tex}' "${source_dirs[@]}" | wc -l)
          echo "Fichiers corrige.tex : $corrige_count"
          echo "Inclusions trouvées : $include_count"
          test "$corrige_count" -eq 383
          test "$include_count" -eq 383
          ! grep -RIl --include='corrige.tex' '\\CorrigeACompleter' "${source_dirs[@]}"

      - name: Enregistrer sur la branche de la pull request
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC CORRECTIONS_REPORT.md tools/RESTORE_DEBUG.txt
          git commit -m 'Matérialiser les 383 fichiers corrige.tex complets [skip ci]'
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Publier le diagnostic de restauration
        if: failure()
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/RESTORE_DEBUG.txt ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/RESTORE_DEBUG.txt
            git commit -m 'Enregistrer le diagnostic de restauration [skip ci]'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
