name: Copier physiquement les 383 corrigés

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restaurer le moteur de complétion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          parts = sorted(Path('tools/vendor').glob('complete_missing_corrections.py.gz.b64.part-*'))
          if len(parts) != 6:
              raise SystemExit(f'Nombre de fragments inattendu : {len(parts)}')

          chunks = [''.join(p.read_text(encoding='utf-8-sig').split()) for p in parts]
          encoded = chunks[0]
          overlaps = []
          for part, chunk in zip(parts[1:], chunks[1:]):
              overlap = 0
              for size in range(min(512, len(encoded), len(chunk)), 0, -1):
                  if encoded.endswith(chunk[:size]):
                      overlap = size
                      break
              overlaps.append((part.name, overlap))
              encoded += chunk[overlap:]

          # Une chaîne Base64 peut être stockée sans son bourrage final.
          encoded += '=' * (-len(encoded) % 4)
          compressed = base64.b64decode(encoded, validate=True)
          script = gzip.decompress(compressed)
          if b'def main' not in script and b'CorrigeQuestion' not in script:
              raise SystemExit('Le contenu restauré ne ressemble pas au moteur Python attendu.')

          output = Path('tools/complete_missing_corrections.py')
          output.write_bytes(script)
          print('Chevauchements supprimés :', overlaps)
          print(f'{len(compressed)} octets compressés, {len(script)} octets restaurés')
          PY
          chmod +x tools/complete_missing_corrections.py
          python3 -m py_compile tools/complete_missing_corrections.py

      - name: Créer les corrigés dans chaque répertoire
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_exercises.py
          python3 tools/generate_corrections.py
          python3 tools/complete_missing_corrections.py

      - name: Vérifier la matérialisation
        shell: bash
        run: |
          set -euo pipefail
          source_dirs=(CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC)
          corrige_count=$(find "${source_dirs[@]}" -type f -name corrige.tex | wc -l)
          include_count=$(grep -RIl --include='*.tex' '\\InclureCorrige{corrige.tex}' "${source_dirs[@]}" | wc -l)
          echo "Fichiers corrige.tex : $corrige_count"
          echo "Inclusions trouvées : $include_count"
          test "$corrige_count" -eq 383
          test "$include_count" -eq 383
          ! grep -RIl --include='corrige.tex' '\\CorrigeACompleter' "${source_dirs[@]}"

      - name: Enregistrer sur la branche de la pull request
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/RESTORE_DEBUG.txt
          git add CIN COR DYN ELEC GEO NUM PERF PPM RDM SEQ SLCI STAT SYS TEC CORRECTIONS_REPORT.md tools/RESTORE_DEBUG.txt
          git commit -m 'Matérialiser les 383 fichiers corrige.tex complets [skip ci]'
          git push origin HEAD:"$TARGET_BRANCH"
