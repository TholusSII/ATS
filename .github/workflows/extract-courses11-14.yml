name: Extraire les cours 11 a 14

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/extract-courses11-14.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Extraire les sources Word
        shell: bash
        run: |
          set -euo pipefail
          extract_course() {
            src="$1"
            outdir="$2"
            outfile="$3"
            mkdir -p "$outdir/pandoc"
            pandoc "$src" --extract-media="$outdir/pandoc" -t markdown -o "$outdir/$outfile"
            {
              echo
              echo '---'
              echo '## Inventaire des images'
              find "$outdir/pandoc" -type f | sort
            } >> "$outdir/$outfile"
          }

          extract_course '11-Actions Mécaniques/Cours/15-ActionsMecaniques.docx' '11-Actions Mécaniques/Cours' 'COURSE11_SOURCE.md'
          extract_course '12-RDM/Cours/16_Rdm_2026.docx' '12-RDM/Cours' 'COURSE12_SOURCE.md'
          extract_course '13-MAS-MS/Cours/17-MAS_MS.docx' '13-MAS-MS/Cours' 'COURSE13_SOURCE.md'
          extract_course '14-Logique/Cours/18-Logique_SED.docx' '14-Logique/Cours' 'COURSE14_SOURCE.md'

      - name: Publier les extractions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '11-Actions Mécaniques/Cours' '12-RDM/Cours' '13-MAS-MS/Cours' '14-Logique/Cours'
          git commit -m 'Extrait les sources des cours 11 a 14' || exit 0
          git push
