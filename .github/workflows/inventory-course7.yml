name: Inventorier les sources du cours 07

on:
  push:
    paths:
      - .github/workflows/inventory-course7.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventorier le cours 07 et les bibliothèques Style
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== DOSSIERS RACINE ==='
            find . -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort
            echo
            echo '=== DOSSIERS ET FICHIERS 07 ==='
            find . -not -path './.git/*' \
              \( -type d -iname '07*' -o -type f \( -iname '7-*.docx' -o -iname '07*' -o -iname '*IntroductionSA*' -o -iname '*acquisition*' -o -iname '*signal*' \) \) | sort
            echo
            echo '=== LIBRAIRIES STYLE ELECTRICITE ELECTRONIQUE SA ==='
            find Style -maxdepth 2 -type f \
              \( -iname '*.sty' -o -iname '*.tex' \) | sort
            echo
            echo '=== REFERENCES CIRCUITIKZ ==='
            grep -RIl --exclude-dir=.git -E 'circuitikz|to\[[RLC]|node\[(op amp|npn|pnp)' Style . 2>/dev/null | sort | head -200
          } > INVENTAIRE_COURS7.txt

      - name: Publier l'inventaire
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add INVENTAIRE_COURS7.txt
          git commit -m 'Ajoute l inventaire des sources du cours 07'
          git push
