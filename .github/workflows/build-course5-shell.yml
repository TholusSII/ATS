name: Contrôle autonome du cours 05

on:
  push:
    paths:
      - .github/workflows/build-course5-shell.yml
      - '05-Modélisation Systèmes Asservis/Cours/**'
      - 'Style/TLSystemesAsservis.sty'
      - 'Style/schemabloc.sty'
      - 'Style/bodegraph.sty'
      - 'Style/Notations_SLCI/**'
      - 'Style/Notations_Maths/**'

permissions:
  contents: write

concurrency:
  group: build-course5-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publier le démarrage
        shell: bash
        run: |
          course='05-Modélisation Systèmes Asservis/Cours'
          printf 'RUNNING\n' > "$course/COMPILATION_COURS5.txt"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$course/COMPILATION_COURS5.txt"
          if ! git diff --cached --quiet; then
            git commit -m 'Démarre le contrôle autonome du cours 05 [skip ci]'
            git push
          fi

      - name: Compiler le document
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          course='05-Modélisation Systèmes Asservis/Cours'
          mkdir -p "$course"
          log="$course/compilation-shell.txt"
          {
            echo "WORKSPACE=$GITHUB_WORKSPACE"
            pwd
            ls -la
            command -v pdflatex || true
            cd "$course"
            pwd
            ls -la 00_Systemes_Asservis.tex 05_Systemes_Asservis.tex
            rm -f 00_Systemes_Asservis.{aux,toc,out,mw,idx,ilg,ind,log,pdf}
            pdflatex -file-line-error -halt-on-error -interaction=nonstopmode 00_Systemes_Asservis.tex
            if [ -f 00_Systemes_Asservis.idx ]; then makeindex 00_Systemes_Asservis.idx; fi
            pdflatex -file-line-error -halt-on-error -interaction=nonstopmode 00_Systemes_Asservis.tex
            pdflatex -file-line-error -halt-on-error -interaction=nonstopmode 00_Systemes_Asservis.tex
          } > "$log" 2>&1

      - name: Enregistrer le résultat
        shell: bash
        run: |
          set -euo pipefail
          course='05-Modélisation Systèmes Asservis/Cours'
          if [ '${{ steps.compile.outcome }}' = 'success' ]; then
            printf 'SUCCESS\n' > "$course/COMPILATION_COURS5.txt"
          else
            printf 'FAILURE\n' > "$course/COMPILATION_COURS5.txt"
          fi
          if [ -f "$course/compilation-shell.txt" ]; then
            cp "$course/compilation-shell.txt" "$course/COMPILATION_COURS5.log"
          elif [ -f "$course/00_Systemes_Asservis.log" ]; then
            cp "$course/00_Systemes_Asservis.log" "$course/COMPILATION_COURS5.log"
          else
            printf 'Aucun journal produit par le runner.\n' > "$course/COMPILATION_COURS5.log"
          fi

      - name: Publier le résultat
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '05-Modélisation Systèmes Asservis/Cours/COMPILATION_COURS5.txt'
          git add '05-Modélisation Systèmes Asservis/Cours/COMPILATION_COURS5.log'
          if [ '${{ steps.compile.outcome }}' = 'success' ]; then
            git add '05-Modélisation Systèmes Asservis/Cours/00_Systemes_Asservis.pdf'
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Met à jour le contrôle autonome du cours 05 [skip ci]'
            git push
          fi

      - name: Échouer après publication du journal
        if: steps.compile.outcome != 'success'
        run: exit 1
