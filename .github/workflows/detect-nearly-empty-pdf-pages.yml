name: Détecter les pages PDF presque vides

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.pdf"
      - "tools/detect_nearly_empty_pdf_pages.py"
      - ".github/workflows/detect-nearly-empty-pdf-pages.yml"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Analyser les PDF
        run: python tools/detect_nearly_empty_pdf_pages.py

      - name: Publier le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pages_pdf_presque_vides.csv reports/pages_pdf_presque_vides.md
          if git diff --cached --quiet; then
            echo "Rapport inchangé"
          else
            git commit -m "Met à jour le rapport des pages PDF presque vides"
            git push
          fi
