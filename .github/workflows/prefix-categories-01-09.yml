name: Préfixer les catégories 01 à 09

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prefix-categories-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rename:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.pull_request.title, 'Préfixer les catégories 01 à 09')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Installer le script validé
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:tools/prefix_top_level_categories.py > tools/prefix_top_level_categories.py
          python3 -m py_compile tools/prefix_top_level_categories.py

      - name: Renommer et vérifier
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prefix_top_level_categories.py

      - name: Enregistrer sur la branche
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Préfixer les catégories 01 à 09 [skip ci]'
          git push origin HEAD:"$TARGET_BRANCH"
