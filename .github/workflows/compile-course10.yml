name: Compiler le cours 10 électronique de puissance

on:
  push:
    paths:
      - '10-Électronique de Puissance/Cours/**'
      - 'Style/**'
      - '.github/workflows/compile-course10.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le cours 10
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_ElectroniquePuissance.tex
          working_directory: 10-Électronique de Puissance/Cours
          latexmk_use_xelatex: false
          extra_system_packages: git
          pre_compile: |
            rm -rf /tmp/kaobook
            git clone --depth 1 https://github.com/fmarotta/kaobook.git /tmp/kaobook
        env:
          TEXINPUTS: ".:/tmp/kaobook//:"

      - name: Publier le PDF
        uses: actions/upload-artifact@v4
        with:
          name: cours-10-electronique-puissance
          path: 10-Électronique de Puissance/Cours/00_ElectroniquePuissance.pdf
