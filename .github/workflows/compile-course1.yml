name: Compiler le cours 1 Ingénierie système

on:
  push:
    paths:
      - '01-Ingénierie système/Cours/**'
      - 'Style/**'
      - '.github/workflows/compile-course1.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils de contrôle
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Compiler le cours 1
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_Ingenierie_Systeme.tex
          working_directory: 01-Ingénierie système/Cours
          latexmk_use_xelatex: false
          extra_system_packages: git
          pre_compile: |
            rm -rf /tmp/kaobook
            git clone --depth 1 https://github.com/fmarotta/kaobook.git /tmp/kaobook
        env:
          TEXINPUTS: ".:/tmp/kaobook//:"

      - name: Contrôler les pages peu remplies
        working-directory: 01-Ingénierie système/Cours
        run: |
          pdfinfo 00_Ingenierie_Systeme.pdf > controle_pdf.txt
          mkdir -p pages_txt
          n=$(pdfinfo 00_Ingenierie_Systeme.pdf | awk '/Pages:/ {print $2}')
          echo "Pages contenant moins de 120 caractères :" >> controle_pdf.txt
          for p in $(seq 1 "$n"); do
            pdftotext -f "$p" -l "$p" -layout 00_Ingenierie_Systeme.pdf "pages_txt/page_${p}.txt"
            c=$(tr -d '[:space:]' < "pages_txt/page_${p}.txt" | wc -c)
            if [ "$c" -lt 120 ]; then
              echo "page $p : $c caractères" >> controle_pdf.txt
            fi
          done
          cat controle_pdf.txt

      - name: Publier le PDF et le contrôle
        uses: actions/upload-artifact@v4
        with:
          name: cours-1-ingenierie-systeme
          path: |
            01-Ingénierie système/Cours/00_Ingenierie_Systeme.pdf
            01-Ingénierie système/Cours/controle_pdf.txt
