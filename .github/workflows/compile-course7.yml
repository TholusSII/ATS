name: Compiler le cours 07 électronique

on:
  push:
    paths:
      - '07-Électronique/Cours/**'
      - 'Style/**'
      - '.github/workflows/compile-course7.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le cours 07
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_Electronique.tex
          working_directory: 07-Électronique/Cours
          latexmk_use_xelatex: false
          extra_system_packages: git
          pre_compile: |
            rm -rf /tmp/kaobook
            git clone --depth 1 https://github.com/fmarotta/kaobook.git /tmp/kaobook
        env:
          TEXINPUTS: ".:/tmp/kaobook//:"

      - name: Publier le PDF
        uses: actions/upload-artifact@v4
        with:
          name: cours-07-electronique
          path: 07-Électronique/Cours/00_Electronique.pdf
